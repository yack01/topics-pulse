services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topicspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topicspulse}
      POSTGRES_DB: ${POSTGRES_DB:-topicspulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topicspulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: pulls the embedding + LLM models into the ollama_data
  # volume on first start. Subsequent `docker compose up` runs are instant
  # no-ops since `ollama pull` skips models already present.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3} && ollama pull ${OLLAMA_LLM_MODEL:-qwen2.5:3b}"
    restart: "no"

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-topicspulse}:${POSTGRES_PASSWORD:-topicspulse}@postgres:5432/${POSTGRES_DB:-topicspulse}?sslmode=disable"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-120s}
      EMBEDDING_POLL_INTERVAL: ${EMBEDDING_POLL_INTERVAL:-5s}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-20}
      ANALYSIS_CRON: ${ANALYSIS_CRON:-0 3 * * *}
      ANALYSIS_PERIODS: ${ANALYSIS_PERIODS:-24h,7d,30d}
      ANALYSIS_SAMPLE_SIZE: ${ANALYSIS_SAMPLE_SIZE:-1200}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-200}
      ANALYSIS_MAX_TOPICS: ${ANALYSIS_MAX_TOPICS:-20}
      ANALYSIS_MIN_SIMILARITY: ${ANALYSIS_MIN_SIMILARITY:-0.45}
      USER_TOPICS_MAX_MESSAGES: ${USER_TOPICS_MAX_MESSAGES:-500}
      USER_TOPICS_MAX_TOPICS: ${USER_TOPICS_MAX_TOPICS:-10}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-20}
      SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-100}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
