<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>TopicsPulse API — REST console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    #topbar-note {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #555;
      background: #fff3cd;
      border-bottom: 1px solid #f0dca0;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <div id="topbar-note">
    Открывайте эту страницу вместе с запущенным <code>docker compose up -d</code> (API на <code>http://localhost:8080</code>).
    Спецификация читается из соседнего файла <code>openapi.yaml</code>.
  </div>
  <div id="swagger-ui"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js" crossorigin="anonymous"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        deepLinking: true,
      });
    };
  </script>
</body>
</html>
